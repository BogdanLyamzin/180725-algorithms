    <script>
      const arr = [8, 3, 1, 0, 10, 2];

      const quickSort = (arr) => {
        if (arr.length <= 1) {
          return arr;
        }

        const pivot = arr[arr.length - 1];
        return partitionSort(arr.slice(0, -1), pivot);
      };

      const partitionSort = (arr, pivot) => {
        console.log(arr)
        const leftArr = [];
        const rightArr = [];
        for (let i = 0; i < arr.length; i += 1) {
          const value = arr[i];
          if (value > pivot) {
            rightArr.push(value);
          } else {
            leftArr.push(value);
          }
        }

        return [...quickSort(leftArr), pivot, ...quickSort(rightArr)];
      };
